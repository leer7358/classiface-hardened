<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClassiFace Admin - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a1a;
            min-height: 100vh;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .admin-login-container {
            background: #1e1e1e;
            padding: 50px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 450px;
            min-width: min(100%, 320px);
            width: 100%;
            border: 1px solid #333;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #FFD700;
            color: #1a1a1a;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            font-size: 40px;
            margin: 0 auto 20px;
            padding: 10px;
            overflow: hidden;
        }
        
        .admin-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
            margin-top: 0;
            font-size: 32px;
            background: #FFD700;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            width: auto;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #FFD700;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s, background-color 0.3s;
            font-family: inherit;
            background: #2a2a2a;
            color: #fff;
        }

        input::placeholder {
            color: #666;
        }

        input:focus {
            outline: none;
            border-color: #FFD700;
            background: #333;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #FFD700;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            margin-top: 20px;
        }

        .login-btn:hover {
            background: #FFC700;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error {
            background: #3a2020;
            color: #ff9999;
            border: 1px solid #663333;
        }

        .success {
            background: #2a3a2a;
            color: #99ff99;
            border: 1px solid #336633;
        }

        .admin-info {
            background: #2a2a3a;
            border-left: 4px solid #FFD700;
            padding: 15px;
            border-radius: 8px;
            font-size: 13px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .divider {
            display: none;
        }

        .footer-links {
            display: none;
        }
    </style>
</head>
<body>
    <div class="admin-login-container">
        <div class="admin-header">
            <div class="admin-badge">
                <img src="/static/admin_icon.png" alt="ClassiFace Admin Icon" class="admin-icon">
            </div>
            <h1>ClassiFace Admin</h1>
            <p class="subtitle">Institutional Management Portal</p>
        </div>

        <div id="message" class="message"></div>

        <div id="adminInfoBox" class="admin-info" style="display: none;">
            <strong>Admin Access Only:</strong> This portal is restricted to authorized administrators. Please use your admin credentials to log in.
        </div>

        <form id="adminLoginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="admin@institution.edu" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">Sign In to Admin Portal</button>
        </form>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js" integrity="sha384-HLJUgAQ2oo6rdMC4QW+Oz2qQfPOtu/lzncKG4sZiq8+2W9uOa3K0b3UGpckKqv7H" crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js" integrity="sha384-+/4lqMnmLqwbdHXshvGDmBTeWlNoPRdjXi4ZsiBj10EhQXaTBe3RF5JZktdSjug6" crossorigin="anonymous"></script>

    <script>
        const firebaseConfig = {
  apiKey: "{{ firebase_web_api_key }}",
  authDomain: "classiface-1a8ca.firebaseapp.com",
  databaseURL: "https://classiface-1a8ca-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "classiface-1a8ca",
  storageBucket: "classiface-1a8ca.firebasestorage.app",
  messagingSenderId: "293433376124",
  appId: "1:293433376124:web:80d9563709e391e3d8f8f9"
};

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const messageDiv = document.getElementById('message');

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
        }

        function setBusy(busy) {
            loginBtn.disabled = busy;
            loginBtn.textContent = busy ? 'Signing in...' : 'Sign In to Admin Portal';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            setBusy(true);

            const email = emailInput.value.trim().toLowerCase();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Please enter email and password.', 'error');
                setBusy(false);
                return;
            }

            try {
                // 1. Sign in with Firebase
                await firebase.auth().signInWithEmailAndPassword(email, password);

                // 2. Get ID token
                const idToken = await firebase.auth().currentUser.getIdToken();

                // 3. Create Flask session (admin-specific endpoint)
                const res = await fetch('/api/auth/admin-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ idToken })
                });

                const out = await res.json().catch(() => ({}));

                if (!res.ok) {
                    const errMsg = out.message || 'Admin login failed.';
                    showMessage(errMsg, 'error');
                    
                    // Show admin-only warning when non-admin tries to access
                    if (errMsg.includes('not an admin') || errMsg.includes('Access denied')) {
                        document.getElementById('adminInfoBox').style.display = 'block';
                    }
                    
                    setBusy(false);
                    return;
                }

                showMessage('✅ Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.replace('/admin/dashboard');
                }, 1000);

            } catch (err) {
                console.error(err);
                let errMsg = err?.message || 'Login error.';
                if (errMsg.includes('user-not-found')) {
                    errMsg = 'Admin account not found.';
                } else if (errMsg.includes('wrong-password')) {
                    errMsg = 'Incorrect password.';
                }
                showMessage(errMsg, 'error');
                setBusy(false);
            }
        });

        // Show any URL params
        const params = new URLSearchParams(window.location.search);
        const msg = params.get('msg');
        if (msg) showMessage(decodeURIComponent(msg), 'error');
    </script>
</body>
</html>
