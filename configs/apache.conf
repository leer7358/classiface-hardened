# ============================================================
# SecureTest - Apache Reverse Proxy Configuration
# Production HTTPS Setup with HTTP to HTTPS Redirect
# ============================================================
# This configuration file should be placed in:
#   /etc/apache2/sites-available/classiface.conf
# Then enable with: sudo a2ensite classiface
# And reload Apache: sudo systemctl reload apache2
# 
# Required Apache modules (enable with a2enmod):
#   sudo a2enmod ssl
#   sudo a2enmod rewrite
#   sudo a2enmod proxy
#   sudo a2enmod proxy_http
#   sudo a2enmod proxy_wstunnel
#   sudo a2enmod headers
# ============================================================

# ============================================================
# HTTP Virtual Host - Redirect all traffic to HTTPS
# ============================================================
<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com *.your-domain.com

    # Log files
    ErrorLog ${APACHE_LOG_DIR}/classiface-http.error.log
    CustomLog ${APACHE_LOG_DIR}/classiface-http.access.log combined

    # Redirect all HTTP traffic to HTTPS
    <IfModule mod_rewrite.c>
        RewriteEngine On
        RewriteCond %{HTTPS} off
        RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    </IfModule>
</VirtualHost>

# ============================================================
# HTTPS Virtual Host - Main Application Server
# ============================================================
<VirtualHost *:443>
    ServerName your-domain.com
    ServerAlias www.your-domain.com

    # ============================================================
    # SSL/TLS Certificate Configuration
    # ============================================================
    # Update these paths to your SSL certificates
    # Recommended: Use Let's Encrypt (free) with Certbot
    # 
    # For Let's Encrypt with Certbot:
    #   sudo certbot certonly --webroot -w /var/www/classiface -d your-domain.com -d www.your-domain.com
    #   Then use: /etc/letsencrypt/live/your-domain.com/fullchain.pem
    #             /etc/letsencrypt/live/your-domain.com/privkey.pem
    # ============================================================
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    SSLCompression off

    SSLCertificateFile /etc/letsencrypt/live/your-domain.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/your-domain.com/privkey.pem
    SSLCertificateChainFile /etc/letsencrypt/live/your-domain.com/chain.pem

    # OCSP Stapling (optional, but recommended)
    SSLUseStapling on
    SSLStaplingCache "shmcb:logs/stapling-cache(150000)"
    SSLStaplingVerifyFile /etc/letsencrypt/live/your-domain.com/chain.pem
    SSLStaplingResponderTimeout 5
    SSLStaplingReturnResponderErrors off

    # ============================================================
    # Logging
    # ============================================================
    ErrorLog ${APACHE_LOG_DIR}/classiface-https.error.log
    CustomLog ${APACHE_LOG_DIR}/classiface-https.access.log combined

    # ============================================================
    # Security Headers
    # ============================================================
    # These will be set by Flask app.py set_headers() function,
    # but you can add additional headers here as well:
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Download-Options "noopen"
    Header always set X-Permitted-Cross-Domain-Policies "none"

    # ============================================================
    # Proxy Configuration
    # ============================================================
    # Assuming Flask application runs on localhost:5000
    # Adjust if your app runs on a different port
    ProxyPreserveHost On
    ProxyRequests Off

    # General proxy settings
    <Proxy *>
        Require all granted
    </Proxy>

    # Pass all requests to the Flask application
    ProxyPass / http://127.0.0.1:5000/ timeout=600 connectiontimeout=60
    ProxyPassReverse / http://127.0.0.1:5000/

    # ============================================================
    # WebSocket Support (Socket.IO)
    # ============================================================
    <IfModule mod_proxy_wstunnel.c>
        ProxyPass /socket.io ws://127.0.0.1:5000/socket.io timeout=600 connectiontimeout=60
        ProxyPassReverse /socket.io ws://127.0.0.1:5000/socket.io
    </IfModule>

    # ============================================================
    # HTTP Request Headers to Backend
    # ============================================================
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
    RequestHeader set X-Forwarded-Port "443"

    # ============================================================
    # Static Files Configuration
    # ============================================================
    # Serve static files directly for better performance
    <Directory /path/to/classiface/static>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        
        # Set cache headers for static assets
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 30 days"
            ExpiresByType application/javascript "access plus 30 days"
            ExpiresByType text/css "access plus 30 days"
            ExpiresByType image/* "access plus 30 days"
            ExpiresByType font/* "access plus 30 days"
        </IfModule>
    </Directory>

    # Do NOT proxy static files
    ProxyPass /static/ !
    ProxyPass /static/ /path/to/classiface/static/

    # ============================================================
    # Security: Deny Access to Sensitive Files
    # ============================================================
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.env$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/configs">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "~$">
        Require all denied
    </FilesMatch>

    # ============================================================
    # Compression
    # ============================================================
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml
        AddOutputFilterByType DEFLATE text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/json
    </IfModule>

    # ============================================================
    # Request Size Limit
    # ============================================================
    # Allow large file uploads (adjust as needed)
    LimitRequestBody 52428800  # 50MB
</VirtualHost>

# ============================================================
# Certificate Auto-Renewal
# ============================================================
# Set up a cron job for Certbot auto-renewal:
#   sudo crontab -e
# Add this line:
#   0 3 * * * /usr/bin/certbot renew --quiet && systemctl reload apache2
# ============================================================
