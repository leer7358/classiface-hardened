# ============================================================
# SecureTest - NGINX Reverse Proxy Configuration
# Production HTTPS Setup with HTTP to HTTPS Redirect
# ============================================================
# This configuration file should be placed in:
#   /etc/nginx/sites-available/classiface
# Then symlink to /etc/nginx/sites-enabled/classiface
# And reload nginx: sudo systemctl reload nginx
# ============================================================

# HTTP Server Block - Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com *.your-domain.com;

    # Redirect all HTTP requests to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS Server Block - Main application server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ============================================================
    # SSL/TLS Certificate Configuration
    # ============================================================
    # Update these paths to your SSL certificates
    # Recommended: Use Let's Encrypt (free) with Certbot
    # 
    # For Let's Encrypt with Certbot:
    #   sudo certbot certonly --webroot -w /var/www/classiface -d your-domain.com -d www.your-domain.com
    #   Then use: /etc/letsencrypt/live/your-domain.com/fullchain.pem
    #             /etc/letsencrypt/live/your-domain.com/privkey.pem
    # ============================================================
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # OCSP Stapling (optional, but recommended)
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Logging
    access_log /var/log/nginx/classiface.access.log;
    error_log /var/log/nginx/classiface.error.log;

    # ============================================================
    # Application Proxy Settings
    # ============================================================
    # Assuming Flask application runs on localhost:5000
    # Adjust the upstream address if your app runs on a different port
    upstream classiface_app {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # Client upload size limit (adjust as needed)
    client_max_body_size 50M;

    # ============================================================
    # Location Block - Proxy all requests to Flask app
    # ============================================================
    location / {
        proxy_pass http://classiface_app;
        
        # Preserve original request information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Preserve connection settings
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 24 4k;
    }

    # ============================================================
    # WebSocket Support (Socket.IO)
    # ============================================================
    location /socket.io {
        proxy_pass http://classiface_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ============================================================
    # Static Files (CSS, JS, Images) - Direct Serving
    # ============================================================
    location /static/ {
        alias /path/to/classiface/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ============================================================
    # Security Headers
    # ============================================================
    # These will be set by Flask app.py set_headers() function,
    # but you can add additional headers here if needed:
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Download-Options "noopen" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ============================================================
    # Deny access to sensitive files
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /configs/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ============================================================
# Certificate Auto-Renewal
# ============================================================
# Set up a cron job for Certbot auto-renewal:
#   sudo crontab -e
# Add this line:
#   0 3 * * * /usr/bin/certbot renew --quiet && systemctl reload nginx
# ============================================================
